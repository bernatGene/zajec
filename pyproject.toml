[project]
name = "zajec"
version = "0.1.0"
description = "Local CLI tool for code review agent to fetch PR context and publish comments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools]
py-modules = ["cli", "github", "normalize"]

[tool.setuptools.packages.find]
include = ["zajecdaemon*"]
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "PLC0415"]
ignore = ["E203", "E701", "B904"]

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.0",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
section-order = ["standard-library", "third-party", "first-party", "local-folder"]


[project.scripts]
zajec = "cli:main"
zajecdaemon = "zajecdaemon.main:main"
